[package]
name = "stundenglas-server"
description = "Multi-user WebUntis sync service with per-user calendar feeds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "stundenglas-server"
path = "src/main.rs"

[dependencies]
stundenglas-core = { path = "../core" }
aes-gcm = "0.10"
anyhow.workspace = true
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
clap = { version = "4", features = ["derive"] }
futures.workspace = true
maud = { version = "0.27", features = ["axum"] }
rand = "0.9"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "uuid",
] }
thiserror = "2"
time = "0.3"
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
sha2.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
