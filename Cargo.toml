[package]
name = "stundenglas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps a personal WebUntis timetable in step with Google Calendar"
license = "MIT"

[[bin]]
name = "stundenglas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "cookies",
    "form",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
    "rustls-native-certs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
